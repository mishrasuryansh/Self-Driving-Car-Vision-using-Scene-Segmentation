version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: self_driving_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: self_driving_db
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: self_driving_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: self_driving_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/self_driving_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: self_driving_worker
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/self_driving_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: self_driving_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
